name: jit-probe
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Probe
        run: |
          f=tests/fixtures/cleanroom/special.json
          php -d opcache.enable_cli=0 probe/detail.php write $f
          for jit in 1205 1235 tracing; do
            echo "jit $jit:"
            php -d opcache.enable_cli=1 -d opcache.file_update_protection=0 -d opcache.jit=$jit -d opcache.jit_buffer_size=128M probe/detail.php compare $f
          done
